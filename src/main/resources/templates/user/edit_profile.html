<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title th:text="${user.name} + ' | SCM' "></title>
  </head>
  <body>
    <div id="content">
      <div th:if="${user}">
        <div th:replace="~{user/sidebar :: sidebar}"></div>
      </div>
      <div class="sm:pl-64">
        <div id="edit_div" class="grid grid-cols-12 mt-5">
          <div class="col-span-2"></div>
          <div class="col-span-12 lg:col-span-8">
            <div
              class="block p-6 border-t-blue-700 border-t-8 bg-white border border-gray-200 rounded-xl shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-t-blue-700 dark:border-x-gray-700 dark:border-b-gray-700 dark:hover:bg-gray-700"
            >
              <div th:if="${message != null}">
                <div
                  th:if="${message.type=='success'}"
                  th:insert="message::messageBoxSuccess"
                ></div>
                <div
                  th:if="${message.type=='error'}"
                  th:insert="message::messageBoxError"
                ></div>
              </div>

              <h5
                class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white"
              >
                Edit your profile
              </h5>
              <p class="font-normal text-gray-700 dark:text-gray-400"></p>

              <form
                th:action="@{'/user/update'}"
                th:object="${userDto}"
                method="post"
                enctype="multipart/form-data"
                novalidate
              >
                <input type="hidden" th:field="*{userId}" />
                <div class="my-2">
                  <label
                    for="name"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Your name</label
                  >
                  <input
                    type="text"
                    id="name"
                    th:field="*{name}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Peter Parker"
                    required
                  />
                  <p
                    th:if="${#fields.hasErrors('name')}"
                    data-th-errors="*{name}"
                    class="text-red-600 p-1 text-sm"
                  ></p>
                </div>

                <div class="mb-2">
                  <label
                    for="phone"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Your Contact number</label
                  >
                  <input
                    type="text"
                    id="phone"
                    th:field="*{phoneNumber}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder=""
                    required
                  />
                  <p
                    th:if="${#fields.hasErrors('phoneNumber')}"
                    data-th-errors="*{phoneNumber}"
                    class="text-red-600 p-1 text-sm"
                  ></p>
                </div>

                <div class="mb-2">
                  <label
                    for="message"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >About you</label
                  >
                  <textarea
                    id="message"
                    th:field="*{about}"
                    rows="4"
                    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Tell us about yourself here..."
                  ></textarea>
                  <p
                    th:if="${#fields.hasErrors('about')}"
                    data-th-errors="*{about}"
                    class="text-red-600 p-1 text-sm"
                  ></p>
                </div>
                <div class="mb-2">
                  <label
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    for="contactImage"
                    >User Image</label
                  >
                  <input
                    id="contactImage"
                    th:field="*{userImage}"
                    class="block w-full text-xs text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
                    aria-describedby="file_input_help"
                    type="file"
                  />
                  <img
                    class="max-h-52 mx-auto rounded-lg shadow m-3 ring-2 ring-fuchsia-500"
                    th:src="*{profilePictureURL}"
                    id="upload_image_preview"
                    onload=""
                  />
                </div>

                <div class="flex justify-center items-center space-x-4 mt-5">
                  <button
                    id="add_contact_button"
                    type="submit"
                    class="uppercase px-3 py-2 rounded-lg bg-gray-800 text-white dark:bg-gray-50 dark:hover:bg-gray-200 dark:text-black"
                  >
                    Save
                  </button>
                  <div
                    class="text-center mt-3"
                    id="spinner"
                    style="display: none"
                  >
                    <div role="status">
                      <svg
                        aria-hidden="true"
                        class="inline w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600"
                        viewBox="0 0 100 101"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                          fill="currentColor"
                        />
                        <path
                          d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                          fill="currentFill"
                        />
                      </svg>
                      <span class="sr-only">Loading...</span>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script th:src="@{'/js/user-scripts.js'}"></script>
  </body>
</html>
